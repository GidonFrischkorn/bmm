name: Claude issue agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: claude-issue-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Gates: actor allowlist always; then either the assign-tm label (fresh
    # issue dispatch) or an @thom-more mention in an issue/PR comment
    # (feedback iteration). thom-more itself is not in the allowlist, so it
    # cannot trigger runs with its own comments.
    if: >
      contains(fromJSON('["GidonFrischkorn"]'), github.actor) &&
      ((github.event_name == 'issues' && github.event.label.name == 'assign-tm') ||
       (github.event_name != 'issues' && contains(github.event.comment.body, '@thom-more')))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PAT }}
          ref: develop
          fetch-depth: 0

      - name: Checkout project memory (claude-memory)
        uses: actions/checkout@v4
        with:
          repository: GidonFrischkorn/claude-memory
          token: ${{ secrets.BOT_PAT }}
          path: .claude-memory

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Mirrors R-CMD-check.yaml: cmdstanr is not on CRAN, so install hard
      # dependencies only (NA) and add the needed Suggests explicitly.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: NA
          extra-packages: |
            any::devtools
            any::testthat
            any::waldo
            any::fansi
            any::withr
            any::dplyr
            any::posterior
            any::tidybayes
            any::ggplot2
            any::mixtur
            any::stringr
            stan-dev/cmdstanr

      - name: Cache Cmdstan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-r-release-v1

      - name: Build Cmdstan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        run: |
          cmdstanr::check_cmdstan_toolchain(fix = TRUE)
          cmdstanr::install_cmdstan(cores = parallel::detectCores())
        shell: Rscript {0}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_PAT }}
          label_trigger: "assign-tm"
          trigger_phrase: "@thom-more"
          bot_name: "thom-more"
          bot_id: "${{ vars.THOM_MORE_ID }}"
          base_branch: "develop"
          branch_prefix: "claude/issue-"
          settings: |
            {
              "attribution": { "commit": "", "pr": "" },
              "permissions": {
                "allow": [
                  "Read", "Edit", "Write",
                  "Bash(git status:*)", "Bash(git diff:*)", "Bash(git log:*)",
                  "Bash(git add:*)", "Bash(git commit:*)", "Bash(git checkout:*)",
                  "Bash(git branch:*)", "Bash(git push:*)",
                  "Bash(gh pr create:*)", "Bash(gh pr view:*)",
                  "Bash(gh issue view:*)", "Bash(gh issue comment:*)",
                  "Bash(Rscript:*)", "Bash(R:*)",
                  "Bash(ls:*)", "Bash(cat:*)", "Bash(grep:*)", "Bash(find:*)", "Bash(wc:*)",
                  "Bash(head:*)", "Bash(tail:*)", "Bash(sort:*)", "Bash(diff:*)",
                  "Bash(sed:*)", "Bash(awk:*)", "Bash(mkdir:*)", "Bash(mv:*)", "Bash(cp:*)", "Bash(touch:*)",
                  "Bash(cd:*)", "Bash(timeout:*)", "Bash(gh pr ready:*)"
                ],
                "deny": [
                  "Bash(git push origin develop:*)",
                  "Bash(git push origin master:*)",
                  "Bash(gh pr merge:*)",
                  "Bash(pip install:*)", "Bash(pip3 install:*)", "Bash(npm install:*)",
                  "Bash(curl:*)", "Bash(wget:*)"
                ]
              }
            }
          prompt: >-
            ${{ github.event_name == 'issues' &&
            format('Work GitHub issue #{0} in this repository (bmm, an R package; the default branch is develop). Follow the conventions in CLAUDE.md. Commit and push your branch as soon as you have a first meaningful unit of work, then keep committing and pushing incrementally — never hold work back until the end, because the run can be cut off by a turn limit. Open a draft pull request to develop referencing the issue right after the first push and update it as you go; mark it ready for review when done. If the issue is labeled "exploration", all code belongs under local/exploration/ and must not modify R/ or inst/ — verify your scripts run instead of running the full test suite. Any claim that a model fits, samples, or recovers parameters must be backed by executing the relevant script during this run, with key output (estimates, Rhat, recovery correlations) quoted in your findings — Stan code generation alone does not verify viability. Run scripts from the repository root, e.g. Rscript local/exploration/<dir>/<script>.R. Otherwise loop internally: implement, run Rscript -e "devtools::test()", fix failures, and re-run until the suite is green; if you changed roxygen comments, also run Rscript -e "devtools::document()". Do not merge. If blocked, comment on the issue describing what you tried, then stop.', github.event.issue.number) || '' }}
          claude_args: |
            --max-turns ${{ contains(github.event.issue.labels.*.name, 'exploration') && 150 || 50 }}
            --append-system-prompt "Project memory is checked out at .claude-memory/projects/-Users-gidonfrischkorn-Documents-GitHub-bmm/memory/. Read INDEX.md and MEMORY.md there before working and consult the listed topic docs (especially feedback_guardrails.md) as needed. Never commit anything under .claude-memory/. Checkpoint discipline: push your work branch and keep a findings comment on the issue updated at every milestone, so progress survives if the run is cut off by turn or time limits."
